services:
  - type: web
    name: ceramo-stock
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ONEC_USER
        sync: false
      - key: ONEC_PASSWORD
        sync: false
      - key: ONEC_ODATA_URL
        sync: false
